server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Keep an already-open admin tab usable across deployments. The HTML may
    # still reference the previous main.<hash>.js/css while the new image only
    # contains the latest hash. Fall back to build-time compatibility copies
    # instead of returning 404 and leaving the admin screen blank.
    location ~* ^/build/admin/main\.[0-9a-f]+\.js$ {
        try_files $uri /build/admin/main.compat.js =404;
        expires 30d;
        access_log off;
    }

    location ~* ^/build/admin/main\.[0-9a-f]+\.css$ {
        try_files $uri /build/admin/main.compat.css =404;
        expires 30d;
        access_log off;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_hide_header Cache-Control;
        fastcgi_hide_header Expires;
        fastcgi_hide_header Pragma;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        fastcgi_pass 127.0.0.1:9000;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location /uploads/media/ {
        alias /var/www/html/public/uploads/media/;
        try_files $uri $uri/ =404;
    }
}
