stages:
  - n8n_sync

# Sync repo-managed workflows into n8n on commit.
# Required CI/CD variables (masked/protected recommended):
#   N8N_BASE_URL : 
#   N8N_API_KEY  : n8n API key (Settings -> n8n API -> Create API Key)
sync:n8n_workflows:
  stage: n8n_sync
  image: alpine:3.19
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - n8n/workflows/*.json
        - scripts/n8n/sync_workflows.sh
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/n8n/sync_workflows.sh


# Scenario 2 OQ: validate the generated memory-regression fix branch.

scenario2:validate_memory_fix:

  stage: n8n_sync

  image: php:8.3-cli-alpine

  rules:

    - if: '$CI_COMMIT_BRANCH =~ /^fix\/sulu-memory-/'

      when: on_success

    - when: never

  script:

    - test -n "$AIOPS_TRACE_ID"

    - test -n "$AIOPS_SELECTED_TESTS"

    - test -s scripts/itsm/sulu/source_overrides/src/AIOpsDemo/MemorySafeReportIterator.php

    - php -l scripts/itsm/sulu/source_overrides/src/AIOpsDemo/MemorySafeReportIterator.php

    - grep -q "yield" scripts/itsm/sulu/source_overrides/src/AIOpsDemo/MemorySafeReportIterator.php